<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  
  <!-- Primary Meta Tags -->
  <title>UK IT Jobs — Daily Tech Opportunities</title>
  <meta name="title" content="UK IT Jobs — Daily Tech Opportunities" />
  <meta name="description" content="Search hundreds of live UK IT & Tech vacancies updated hourly across Software, Cloud, DevOps, Cyber, and Support." />

  <!-- Open Graph / Facebook / LinkedIn / WhatsApp -->
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://venubabu2620.github.io/UK-IT-JOBS/" />
  <meta property="og:title" content="UK IT Jobs — Live Tech Opportunities 🇬🇧" />
  <meta property="og:description" content="Direct application links for Software Engineers, DevOps, Cloud Architects, and IT specialists across the UK." />
  <meta property="og:image" content="https://images.unsplash.com/photo-1517245386807-bb43f82c33c4?q=80&w=1200&auto=format&fit=crop" />

  <!-- Twitter -->
  <meta property="twitter:card" content="summary_large_image" />
  <meta property="twitter:url" content="https://venubabu2620.github.io/UK-IT-JOBS/" />
  <meta property="twitter:title" content="UK IT Jobs — Live Tech Opportunities 🇬🇧" />
  <meta property="twitter:description" content="Direct application links for Software Engineers, DevOps, Cloud Architects, and IT specialists across the UK." />
  <meta property="twitter:image" content="https://images.unsplash.com/photo-1517245386807-bb43f82c33c4?q=80&w=1200&auto=format&fit=crop" />

  <!-- Tailwind & Supabase Scripts -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-slate-50 text-slate-900 min-h-screen flex flex-col antialiased">

  <!-- Sticky Header -->
  <header class="bg-white border-b border-slate-200 sticky top-0 z-20 shadow-sm">
    <div class="max-w-6xl mx-auto px-4 py-3.5 flex flex-wrap items-center justify-between gap-3">
      <div class="flex items-center gap-3">
        <h1 class="text-xl font-bold tracking-tight text-slate-800">
          UK<span class="text-emerald-600">IT</span> Jobs
        </h1>
        <span class="hidden sm:inline-block text-xs bg-emerald-100 text-emerald-800 font-semibold px-2.5 py-1 rounded-full">
          🇬🇧 High-Volume Tech Board
        </span>
      </div>

      <!-- 1-Click Share Buttons -->
      <div class="flex items-center gap-2">
        <!-- WhatsApp -->
        <a
          href="https://api.whatsapp.com/send?text=Check%20out%20this%20free%20UK%20IT%20Job%20Board%20with%20live%20tech%20roles%3A%20https%3A%2F%2Fvenubabu2620.github.io%2FUK-IT-JOBS%2F"
          target="_blank"
          rel="noopener noreferrer"
          class="inline-flex items-center gap-1.5 px-3 py-1.5 bg-[#25D366] hover:bg-[#20ba59] text-white text-xs font-semibold rounded-lg shadow-sm transition"
        >
          <svg class="w-3.5 h-3.5 fill-current" viewBox="0 0 24 24">
            <path d="M.057 24l1.687-6.163c-1.041-1.804-1.588-3.849-1.587-5.946.003-6.556 5.338-11.891 11.893-11.891 3.181.001 6.167 1.24 8.413 3.488 2.245 2.248 3.481 5.236 3.48 8.414-.003 6.557-5.338 11.892-11.893 11.892-1.99-.001-3.951-.5-5.688-1.448l-6.305 1.654zm6.597-3.807c1.676.995 3.276 1.591 5.392 1.592 5.448 0 9.886-4.434 9.889-9.885.002-5.462-4.415-9.89-9.881-9.892-5.452 0-9.887 4.434-9.889 9.884-.001 2.225.651 3.891 1.746 5.634l-.999 3.648 3.742-.981z"/>
          </svg>
          <span class="hidden md:inline">Share</span>
        </a>

        <!-- LinkedIn -->
        <a
          href="https://www.linkedin.com/sharing/share-offsite/?url=https%3A%2F%2Fvenubabu2620.github.io%2FUK-IT-JOBS%2F"
          target="_blank"
          rel="noopener noreferrer"
          class="inline-flex items-center gap-1.5 px-3 py-1.5 bg-[#0A66C2] hover:bg-[#084e96] text-white text-xs font-semibold rounded-lg shadow-sm transition"
        >
          <svg class="w-3.5 h-3.5 fill-current" viewBox="0 0 24 24">
            <path d="M19 0h-14c-2.761 0-5 2.239-5 5v14c0 2.761 2.239 5 5 5h14c2.762 0 5-2.239 5-5v-14c0-2.761-2.238-5-5-5zm-11 19h-3v-11h3v11zm-1.5-12.268c-.966 0-1.75-.79-1.75-1.764s.784-1.764 1.75-1.764 1.75.79 1.75 1.764-.783 1.764-1.75 1.764zm13.5 12.268h-3v-5.604c0-3.368-4-3.113-4 0v5.604h-3v-11h3v1.765c1.396-2.586 7-2.777 7 2.476v6.759z"/>
          </svg>
          <span class="hidden md:inline">Post</span>
        </a>

        <!-- Copy Link Button -->
        <button
          onclick="copySiteLink()"
          id="copyBtn"
          class="inline-flex items-center gap-1.5 px-3 py-1.5 bg-slate-800 hover:bg-slate-900 text-white text-xs font-semibold rounded-lg shadow-sm transition"
        >
          <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z"></path>
          </svg>
          <span id="copyBtnText">Copy Link</span>
        </button>
      </div>
    </div>
  </header>

  <!-- Hero & Filter Section -->
  <main class="max-w-6xl mx-auto px-4 py-8 flex-grow w-full">
    <div class="text-center max-w-2xl mx-auto mb-8">
      <h2 class="text-3xl font-extrabold text-slate-900 mb-2">UK IT & Tech Opportunities</h2>
      <p class="text-sm text-slate-500 mb-6">Aggregated daily across Software, Cloud, DevOps, Data & Support.</p>
      
      <!-- Search Input -->
      <div class="relative max-w-xl mx-auto mb-4">
        <input
          id="searchInput"
          type="text"
          placeholder="Search by keywords, job title, company, or tech stack..."
          class="w-full pl-4 pr-10 py-3 text-sm border border-slate-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-emerald-500 bg-white shadow-sm"
        />
        <svg class="w-5 h-5 absolute right-3.5 top-3 text-slate-400 pointer-events-none" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
        </svg>
      </div>

      <!-- Quick Category Filter Chips -->
      <div class="flex flex-wrap justify-center gap-1.5 text-xs mb-3">
        <button onclick="applyChipFilter('all')" class="filter-chip active-chip px-3 py-1.5 rounded-full border border-slate-200 bg-slate-900 text-white font-medium transition">All Roles</button>
        <button onclick="applyChipFilter('remote')" class="filter-chip px-3 py-1.5 rounded-full border border-slate-200 bg-white text-slate-700 hover:bg-slate-100 font-medium transition">🏠 Remote</button>
        <button onclick="applyChipFilter('developer')" class="filter-chip px-3 py-1.5 rounded-full border border-slate-200 bg-white text-slate-700 hover:bg-slate-100 font-medium transition">💻 Software / Dev</button>
        <button onclick="applyChipFilter('devops')" class="filter-chip px-3 py-1.5 rounded-full border border-slate-200 bg-white text-slate-700 hover:bg-slate-100 font-medium transition">☁️ Cloud / DevOps</button>
        <button onclick="applyChipFilter('data')" class="filter-chip px-3 py-1.5 rounded-full border border-slate-200 bg-white text-slate-700 hover:bg-slate-100 font-medium transition">📊 Data / AI</button>
        <button onclick="applyChipFilter('cyber')" class="filter-chip px-3 py-1.5 rounded-full border border-slate-200 bg-white text-slate-700 hover:bg-slate-100 font-medium transition">🔒 Cyber Security</button>
        <button onclick="applyChipFilter('support')" class="filter-chip px-3 py-1.5 rounded-full border border-slate-200 bg-white text-slate-700 hover:bg-slate-100 font-medium transition">🛠️ IT Support</button>
      </div>

      <!-- City Quick Filter -->
      <div class="flex flex-wrap justify-center gap-1.5 text-xs">
        <span class="text-slate-400 py-1 text-[11px] self-center">Popular Locations:</span>
        <button onclick="applyCityFilter('London')" class="text-emerald-700 hover:underline bg-emerald-50 px-2 py-0.5 rounded border border-emerald-100">London</button>
        <button onclick="applyCityFilter('Manchester')" class="text-emerald-700 hover:underline bg-emerald-50 px-2 py-0.5 rounded border border-emerald-100">Manchester</button>
        <button onclick="applyCityFilter('Birmingham')" class="text-emerald-700 hover:underline bg-emerald-50 px-2 py-0.5 rounded border border-emerald-100">Birmingham</button>
        <button onclick="applyCityFilter('Bristol')" class="text-emerald-700 hover:underline bg-emerald-50 px-2 py-0.5 rounded border border-emerald-100">Bristol</button>
        <button onclick="applyCityFilter('Edinburgh')" class="text-emerald-700 hover:underline bg-emerald-50 px-2 py-0.5 rounded border border-emerald-100">Edinburgh</button>
      </div>

      <!-- Result Count Bar -->
      <div class="mt-4 text-xs font-medium text-slate-500" id="resultsCount">
        Loading live opportunities...
      </div>
    </div>

    <!-- Job Cards Grid -->
    <div id="jobList" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-5">
      <div class="p-5 bg-white border border-slate-200 rounded-xl animate-pulse h-48"></div>
      <div class="p-5 bg-white border border-slate-200 rounded-xl animate-pulse h-48"></div>
      <div class="p-5 bg-white border border-slate-200 rounded-xl animate-pulse h-48"></div>
    </div>
  </main>

  <footer class="text-center py-6 text-xs text-slate-400 border-t border-slate-200 bg-white">
    © 2026 UK IT Jobs Daily. Direct application links.
  </footer>

  <script>
    const SUPABASE_URL = "https://mjmbpjulosdywzperdhe.supabase.co";
    const SUPABASE_ANON_KEY = "sb_publishable_voOWFppdSdr1LJPcelmGSQ_74FqLmKK";

    const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    let allJobs = [];
    let activeFilter = 'all';

    async function fetchJobs() {
      const { data, error } = await supabaseClient
        .from('jobs')
        .select('*')
        .order('created_at', { ascending: false })
        .limit(2000);

      if (error) {
        console.error("Error fetching jobs:", error);
        document.getElementById('jobList').innerHTML = '<p class="col-span-full text-center text-red-500 py-10">Error loading jobs: ' + error.message + '</p>';
        return;
      }

      allJobs = data || [];
      filterAndRender();
    }

    function renderJobs(jobs) {
      const container = document.getElementById('jobList');
      const countEl = document.getElementById('resultsCount');

      countEl.innerText = `Showing ${jobs.length} available tech roles`;

      if (jobs.length === 0) {
        container.innerHTML = '<p class="col-span-full text-center text-slate-500 py-10">No matching IT jobs found for this search/filter.</p>';
        return;
      }

      container.innerHTML = jobs.map(job => `
        <div class="bg-white border border-slate-200 rounded-xl p-5 shadow-sm hover:shadow-md transition flex flex-col justify-between">
          <div>
            <div class="flex items-start justify-between gap-2 mb-2">
              <h3 class="font-semibold text-slate-900 line-clamp-1">${job.title}</h3>
              <span class="text-[10px] font-medium bg-emerald-50 text-emerald-700 px-2 py-0.5 rounded border border-emerald-200">IT</span>
            </div>
            <p class="text-xs font-medium text-emerald-600 mb-1">${job.company}</p>
            <p class="text-xs text-slate-400 mb-3">📍 ${job.location || 'United Kingdom'}</p>
            <p class="text-xs text-slate-600 line-clamp-3 mb-4 leading-relaxed">${job.job_description}</p>
          </div>
          <a
            href="${job.apply_url}"
            target="_blank"
            rel="noopener noreferrer"
            class="block text-center w-full py-2 bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-medium rounded-lg transition"
          >
            Apply Now &rarr;
          </a>
        </div>
      `).join('');
    }

    function filterAndRender() {
      const searchVal = document.getElementById('searchInput').value.toLowerCase().trim();
      
      let filtered = allJobs.filter(job => {
        const text = `${job.title || ''} ${job.company || ''} ${job.location || ''} ${job.job_description || ''}`.toLowerCase();
        
        const matchesSearch = !searchVal || text.includes(searchVal);
        
        let matchesChip = true;
        if (activeFilter === 'remote') {
          matchesChip = text.includes('remote') || text.includes('hybrid') || text.includes('work from home');
        } else if (activeFilter === 'developer') {
          matchesChip = text.includes('developer') || text.includes('software') || text.includes('frontend') || text.includes('backend') || text.includes('full stack');
        } else if (activeFilter === 'devops') {
          matchesChip = text.includes('devops') || text.includes('cloud') || text.includes('aws') || text.includes('azure') || text.includes('infrastructure');
        } else if (activeFilter === 'data') {
          matchesChip = text.includes('data') || text.includes('ai') || text.includes('machine learning') || text.includes('analytics');
        } else if (activeFilter === 'cyber') {
          matchesChip = text.includes('security') || text.includes('cyber') || text.includes('soc') || text.includes('penetration');
        } else if (activeFilter === 'support') {
          matchesChip = text.includes('support') || text.includes('helpdesk') || text.includes('administrator') || text.includes('service desk');
        }

        return matchesSearch && matchesChip;
      });

      renderJobs(filtered);
    }

    function applyChipFilter(filterType) {
      activeFilter = filterType;
      document.querySelectorAll('.filter-chip').forEach(btn => {
        btn.classList.remove('bg-slate-900', 'text-white');
        btn.classList.add('bg-white', 'text-slate-700');
      });
      event.target.classList.add('bg-slate-900', 'text-white');
      event.target.classList.remove('bg-white', 'text-slate-700');
      filterAndRender();
    }

    function applyCityFilter(cityName) {
      document.getElementById('searchInput').value = cityName;
      filterAndRender();
    }

    document.getElementById('searchInput').addEventListener('input', filterAndRender);

    function copySiteLink() {
      const siteUrl = "https://venubabu2620.github.io/UK-IT-JOBS/";
      navigator.clipboard.writeText(siteUrl).then(() => {
        const btnText = document.getElementById('copyBtnText');
        btnText.innerText = "Copied! ✓";
        setTimeout(() => {
          btnText.innerText = "Copy Link";
        }, 2000);
      });
    }

    fetchJobs();
  </script>

  <!-- Privacy-Friendly Analytics -->
  <script src="https://cdn.counter.dev/script.js" data-id="venubabu-ukjobs" data-utcoffset="1"></script>
</body>
</html>
