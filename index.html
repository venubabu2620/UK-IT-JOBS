/* Compact job cards: add this block at the END of your existing <style> section */
.job-card-content { padding: 1rem !important; }
.job-card-heading { margin-bottom: .65rem !important; }
.job-card-logo { width: 2.5rem !important; height: 2.5rem !important; border-radius: .65rem !important; font-size: 1rem !important; }
.job-card-meta { margin-bottom: .6rem !important; gap: .35rem !important; }
.job-card-tags { margin-bottom: .7rem !important; gap: .35rem !important; }
.job-card-actions { padding-top: .7rem !important; }
.job-card-apply { padding-top: .65rem !important; padding-bottom: .65rem !important; }
.job-card-footer { margin-top: .25rem !important; }
@media (max-width: 640px) {
  .job-card-content { padding: .85rem !important; }
  .job-card-heading { gap: .6rem !important; }
  .job-card-apply { padding-top: .7rem !important; padding-bottom: .7rem !important; }
}
