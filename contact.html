<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#059669">
  <title>Contact Us | UK IT Jobs</title>
  <meta name="description" content="Contact UK IT Jobs about listings, privacy, or technical issues.">
  <script src="https://cdn.tailwindcss.com"></script>
  <style>body{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}</style>
</head>
<body class="min-h-screen bg-slate-50 text-slate-800 flex flex-col">
<header class="border-b border-slate-200 bg-white"><div class="mx-auto flex w-full max-w-4xl items-center justify-between px-5 py-5"><a href="/UK-IT-JOBS/" class="text-xl font-extrabold text-slate-900">UK<span class="text-emerald-600">IT</span> Jobs</a><a href="/UK-IT-JOBS/" class="text-sm font-semibold text-emerald-700 hover:underline">← Back to jobs</a></div></header>
<main class="mx-auto w-full max-w-4xl flex-1 px-5 py-10"><article class="rounded-2xl border border-slate-200 bg-white p-6 shadow-sm sm:p-10">
<p class="text-xs font-bold uppercase tracking-widest text-emerald-700">UK IT Jobs</p><h1 class="mt-2 text-3xl font-extrabold tracking-tight text-slate-900">Contact Us</h1><p class="mt-3 text-slate-600">Have a question, spotted an expired listing, or want to report an issue? Send us a message using the form below.</p>
<form id="contactForm" class="mt-8 space-y-5">
<input type="hidden" name="access_key" value="d626edd0-1626-48f0-b19f-d5d4f8898fe2"><input type="hidden" name="from_name" value="UK IT Jobs Website"><input type="hidden" name="subject" value="New contact message - UK IT Jobs"><input type="checkbox" name="botcheck" class="hidden" style="display:none">
<div><label for="name" class="mb-1 block font-semibold text-slate-800">Your name</label><input id="name" name="name" type="text" required maxlength="100" autocomplete="name" class="w-full rounded-xl border border-slate-300 px-4 py-3 outline-none focus:border-emerald-500 focus:ring-2 focus:ring-emerald-100"></div>
<div><label for="email" class="mb-1 block font-semibold text-slate-800">Your email</label><input id="email" name="email" type="email" required maxlength="200" autocomplete="email" class="w-full rounded-xl border border-slate-300 px-4 py-3 outline-none focus:border-emerald-500 focus:ring-2 focus:ring-emerald-100"></div>
<div><label for="topic" class="mb-1 block font-semibold text-slate-800">What is your message about?</label><select id="topic" name="topic" required class="w-full rounded-xl border border-slate-300 bg-white px-4 py-3 outline-none focus:border-emerald-500 focus:ring-2 focus:ring-emerald-100"><option value="General enquiry">General enquiry</option><option value="Report an expired or incorrect job">Report an expired or incorrect job</option><option value="Privacy request">Privacy request</option><option value="Technical issue">Technical issue</option><option value="Other">Other</option></select></div>
<div><label for="message" class="mb-1 block font-semibold text-slate-800">Message</label><textarea id="message" name="message" required rows="6" maxlength="5000" class="w-full rounded-xl border border-slate-300 px-4 py-3 outline-none focus:border-emerald-500 focus:ring-2 focus:ring-emerald-100"></textarea></div>
<button id="submitButton" type="submit" class="rounded-xl bg-emerald-600 px-5 py-3 font-bold text-white hover:bg-emerald-700 disabled:cursor-not-allowed disabled:opacity-60">Send Message →</button><p id="formStatus" role="status" aria-live="polite" class="hidden rounded-xl p-4 text-sm"></p><p class="text-xs leading-5 text-slate-500">Please do not include passwords, payment details, or other sensitive information in your message.</p>
</form></article></main><footer class="mt-8 border-t border-slate-200 bg-white px-5 py-6 text-center text-xs text-slate-500">© <span id="year"></span> UK IT Jobs. All rights reserved.</footer>
<script>
document.getElementById('year').textContent = new Date().getFullYear();
const form = document.getElementById('contactForm');
const statusBox = document.getElementById('formStatus');
const submitButton = document.getElementById('submitButton');
form.addEventListener('submit', async function(event) {
  event.preventDefault(); statusBox.className = 'hidden rounded-xl p-4 text-sm'; statusBox.textContent = '';
  submitButton.disabled = true; submitButton.textContent = 'Sending…';
  try {
    const response = await fetch('https://api.web3forms.com/submit', { method: 'POST', body: new FormData(form) });
    const result = await response.json();
    if (response.ok && result.success) {
      statusBox.className = 'rounded-xl bg-emerald-50 p-4 text-sm text-emerald-800';
      statusBox.textContent = 'Thank you! Your message has been sent successfully.'; form.reset();
    } else { throw new Error(result.message || 'The message could not be sent. Please try again.'); }
  } catch (error) {
    statusBox.className = 'rounded-xl bg-red-50 p-4 text-sm text-red-800';
    statusBox.textContent = error.message || 'Something went wrong. Please try again in a moment.';
  } finally { submitButton.disabled = false; submitButton.textContent = 'Send Message →'; }
});
</script></body></html>
